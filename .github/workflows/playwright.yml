# Schedule (Mon–Fri, Asia/Kolkata IST = UTC+5:30 → cron uses UTC):
#   Two clock starts only. Each shard is 45 min job timeout.
#   Morning 06:30 IST and evening 17:00 IST start field shard 1.
#   After that run finishes (pass, fail, cancel, or timeout), the queue-next job
#   starts the next shard: field 2→5 → conditional 1→3 → formula 1→5, then stops.
#   Manual run: pick suite + shard (all runs every shard in parallel; 1–5 runs one chunk ~100 tests).
#   Leave "chain" off for manual runs so a one-off does not start the full wave.
# Email digest (pass / fail / skip / flaky) → repo Variable EMAIL_RECIPIENTS_BASE (comma-separated).
name: Oman E-Invoice — Playwright

on:
  schedule:
    - cron: "0 1 * * 1-5" # 06:30 IST — start morning wave (field shard 1)
    - cron: "30 11 * * 1-5" # 17:00 IST — start evening wave (field shard 1)

  workflow_dispatch:
    inputs:
      suite:
        description: "Covoro automation suite to run."
        required: true
        default: "covoro_field"
        type: choice
        options:
          - covoro_field
          - covoro_formula
          - covoro_conditional
      shard:
        description: "Shard chunk (~100 tests). Field has 5 shards, formula has 5, conditional has 3."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      chain:
        description: "Leave off for manual runs. On = continue morning/evening wave after this shard."
        required: false
        type: boolean
        default: false

run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && 'Field validation 1'
      || github.event.inputs.shard == 'all' && github.event.inputs.suite == 'covoro_formula' && 'Formula validation all'
      || github.event.inputs.suite == 'covoro_formula' && format('Formula validation {0}', github.event.inputs.shard)
      || github.event.inputs.shard == 'all' && (github.event.inputs.suite == 'covoro_conditional' && 'Conditional validation all' || 'Field validation all')
      || github.event.inputs.suite == 'covoro_conditional' && format('Conditional validation {0}', github.event.inputs.shard)
      || format('Field validation {0}', github.event.inputs.shard) }}

concurrency:
  group: omn-e-invoice-playwright
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  SUBMIT_INVOICE_COMBINATIONS: "all"
  PW_WORKERS: "5"
  PW_CI_SHARD_SIZE: "100"
  PW_CI_JOB_TIMEOUT_MINUTES: "45"
  UAE_EINVOICE_SELLER_TIN_SLOTS: "OM1108202600,OM1108202601,OM1108202602,OM1108202603,OM1108202604"

jobs:
  should_run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Gate scheduled runs if paused (manual or 1 IST day)
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_IST=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          FILE=".github/PLAYWRIGHT_SKIP_SCHEDULE_UNTIL"
          if [ -f "$FILE" ]; then
            READ=$(head -1 "$FILE" | tr -d '\r')
            READ=$(echo "$READ" | xargs)
            if [ "$READ" = "manual" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Scheduled Playwright runs are paused until manual resume. Resume: Actions → Oman E-Invoice — Schedule control → resume_scheduled_runs."
              exit 0
            fi
            if [ "$READ" = "$TODAY_IST" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Scheduled Playwright runs are paused for IST date ${TODAY_IST} (1-day pause). Resume early: Actions → Oman E-Invoice — Schedule control → resume_scheduled_runs."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  resolve:
    needs: should_run
    if: needs.should_run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      spec: ${{ steps.plan.outputs.spec }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      shard_indices: ${{ steps.plan.outputs.shard_indices }}
      shard_size: ${{ steps.plan.outputs.shard_size }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies (shard plan)
        run: npm ci

      - name: Resolve suite + shard (schedule slots · manual dropdown)
        id: mode
        shell: bash
        run: |
          MODE="covoro_field"
          SHARD_FILTER="1"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.suite }}"
            SHARD_FILTER="${{ github.event.inputs.shard }}"

          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Both clock starts (06:30 / 17:00 IST) begin the wave at field shard 1.
            MODE="covoro_field"
            SHARD_FILTER="1"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "shard_filter=$SHARD_FILTER" >> "$GITHUB_OUTPUT"
          echo "Running MODE=$MODE shard_filter=$SHARD_FILTER"

      - name: Plan Playwright shards (~100 tests per job)
        id: plan
        shell: bash
        run: |
          bash scripts/ci_playwright_shard_plan.sh \
            "${{ steps.mode.outputs.mode }}" \
            "${{ steps.mode.outputs.shard_filter }}"

  test:
    needs: [should_run, resolve]
    if: needs.should_run.outputs.skip != 'true'
    name: test (shard ${{ matrix.shard }}/${{ needs.resolve.outputs.shard_total }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.resolve.outputs.shard_indices) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify pinned Node and Playwright
        run: |
          node -v
          npx playwright --version
          node -e "const v=require('@playwright/test/package.json').version; if(v!=='1.60.0'){console.error('Expected @playwright/test 1.60.0, got '+v); process.exit(1)}"

      - name: Set up Java (Allure report generator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "UAE_EINVOICE_SELLER_TIN_SLOTS=${UAE_EINVOICE_SELLER_TIN_SLOTS}" >> .env

      - name: Verify required environment variables
        run: |
          missing=0
          for key in BASE_URL TEST_USER_EMAIL TEST_USER_PASSWORD; do
            val=$(grep -E "^${key}=" .env | cut -d= -f2- || true)
            if [ -z "${val:-}" ]; then
              echo "::error::Missing or empty ${key}. Set the ${key} secret in GitHub Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Run Playwright — Covoro field / formula / conditional
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results-shard-${{ matrix.shard }}-of-${{ needs.resolve.outputs.shard_total }}.json
          PW_WORKERS: "5"
        run: |
          SPEC="${{ needs.resolve.outputs.spec }}"
          SHARD="${{ matrix.shard }}"
          TOTAL="${{ needs.resolve.outputs.shard_total }}"
          set -e

          SHARD_ARGS=()
          if [ "$TOTAL" -gt 1 ]; then
            SHARD_ARGS=(--shard="${SHARD}/${TOTAL}")
            echo "Running shard ${SHARD}/${TOTAL} (~${{ needs.resolve.outputs.shard_size }} tests per shard) on ${SPEC}"
          else
            echo "Running full suite (no shard) on ${SPEC}"
          fi

          npx playwright test "$SPEC" --project=chromium "${SHARD_ARGS[@]}"

      - name: Report name (matches run name)
        id: report
        if: always()
        shell: bash
        run: |
          MODE="${{ needs.resolve.outputs.mode }}"
          SHARD="${{ matrix.shard }}"
          case "$MODE" in
            covoro_field) LABEL="Field validation ${SHARD}" ;;
            covoro_conditional) LABEL="Conditional validation ${SHARD}" ;;
            covoro_formula) LABEL="Formula validation ${SHARD}" ;;
            *) LABEL="Playwright ${MODE} ${SHARD}" ;;
          esac
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Report name: $LABEL"

      - name: Generate Allure report (single-file HTML)
        if: always()
        shell: bash
        run: |
          LABEL="${{ steps.report.outputs.label }}"
          if [ -d allure-results ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate allure-results --clean --single-file -o allure-report
            cp -f allure-report/index.html "${LABEL}.html"
          else
            echo "No allure-results; skipping Allure HTML"
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.report.outputs.label }}
          path: ${{ steps.report.outputs.label }}.html
          retention-days: 2
          if-no-files-found: ignore

      - name: Summarize Playwright results (pass / fail / skip / flaky)
        id: summary
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results-shard-${{ matrix.shard }}-of-${{ needs.resolve.outputs.shard_total }}.json
        run: python scripts/playwright_json_summary.py

      - name: Prepare email (Allure attachment)
        id: email_attach
        if: always()
        env:
          EMAIL_MAX_ATTACHMENT_BYTES: ${{ vars.EMAIL_MAX_ATTACHMENT_BYTES }}
        shell: bash
        run: |
          MAX="${EMAIL_MAX_ATTACHMENT_BYTES:-23068672}"
          LABEL="${{ steps.report.outputs.label }}"
          HTML="${LABEL}.html"
          ZIP="${LABEL}.zip"
          GZ="${LABEL}.html.gz"
          LIST=""
          rm -f allure-report-email.zip allure-index.html.gz "$ZIP" "$GZ"

          if [ -f "$HTML" ] || [ -f allure-report/index.html ]; then
            SRC="$HTML"
            if [ ! -f "$SRC" ]; then
              SRC="allure-report/index.html"
            fi
            SZ=$(wc -c < "$SRC" | tr -d ' ')
            if [ "${SZ:-0}" -le "$MAX" ] && [ "${SZ:-0}" -gt 32 ]; then
              if [ "$SRC" != "$HTML" ]; then
                cp -f "$SRC" "$HTML"
              fi
              LIST="$HTML"
            else
              zip -9 -q "$ZIP" "$SRC"
              if [ -f "$ZIP" ]; then
                ZSZ=$(wc -c < "$ZIP" | tr -d ' ')
                if [ "${ZSZ:-0}" -le "$MAX" ] && [ "${ZSZ:-0}" -gt 32 ]; then
                  LIST="$ZIP"
                else
                  rm -f "$ZIP"
                  gzip -9 -c "$SRC" > "$GZ"
                  GSZ=$(wc -c < "$GZ" | tr -d ' ')
                  if [ "${GSZ:-0}" -le "$MAX" ] && [ "${GSZ:-0}" -gt 32 ]; then
                    LIST="$GZ"
                  else
                    rm -f "$GZ"
                  fi
                fi
              fi
            fi
          fi

          echo "files=$LIST" >> "$GITHUB_OUTPUT"

      - name: Prepare SMTP email
        id: mail
        if: always()
        shell: bash
        run: |
          if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email skipped — set SMTP_HOST, SMTP_USER, and SMTP_PASS in repo Actions secrets."
            exit 0
          fi

          R="${EMAIL_RECIPIENTS_BASE:-${EMAIL_TO:-}}"
          if [ -z "${R:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email skipped — set repo Variable EMAIL_RECIPIENTS_BASE or secret EMAIL_TO."
            exit 0
          fi

          FROM_ADDR="${EMAIL_FROM:-$SMTP_USER}"
          PORT="${SMTP_PORT:-587}"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "to=$R" >> "$GITHUB_OUTPUT"
          echo "from=$FROM_ADDR" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          if [ "$PORT" = "465" ]; then
            echo "secure=true" >> "$GITHUB_OUTPUT"
          else
            echo "secure=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_RECIPIENTS_BASE: ${{ vars.EMAIL_RECIPIENTS_BASE }}

      - name: Email digest metadata (UTC date)
        id: mail_body
        if: always()
        shell: bash
        run: |
          {
            echo "date<<MAILBODY_EOF"
            date -u +'%d %b %Y'
            echo "MAILBODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email — execution digest
        if: ${{ !cancelled() && steps.mail.outputs.ok == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ steps.mail.outputs.port }}
          secure: ${{ steps.mail.outputs.secure == 'true' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: >-
            Oman E-Invoice (${{ steps.report.outputs.label }}) — PASSED ${{ steps.summary.outputs.passed }}, FAILED ${{ steps.summary.outputs.failed }}, SKIPPED ${{ steps.summary.outputs.skipped }}, FLAKY ${{ steps.summary.outputs.flaky }}
          to: ${{ steps.mail.outputs.to }}
          from: ${{ steps.mail.outputs.from }}
          attachments: ${{ steps.email_attach.outputs.files }}
          body: |
            Hi Team — Oman E-Invoice Playwright summary (${{ steps.mail_body.outputs.date }} UTC).
            Passed ${{ steps.summary.outputs.passed }}, Failed ${{ steps.summary.outputs.failed }}, Skipped ${{ steps.summary.outputs.skipped }}, Flaky ${{ steps.summary.outputs.flaky }} (total ${{ steps.summary.outputs.total }}).
            Overall: ${{ steps.summary.outputs.overall }}.
            Suite: ${{ steps.report.outputs.label }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: |
            <p>Hi Team,</p>
            <p>Please find below the <strong>automation test execution summary</strong> for the <strong>Oman E-Invoice</strong> framework (Playwright).</p>
            <h3 style="margin:20px 0 8px 0;font-family:Segoe UI,Arial,sans-serif;">Execution summary</h3>
            <table style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:14px;max-width:560px;">
              <tr><td style="padding:6px 16px 6px 0;color:#555;vertical-align:top;">Date (UTC)</td><td style="padding:6px 0;"><strong>${{ steps.mail_body.outputs.date }}</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Framework</td><td style="padding:6px 0;"><strong>Oman E-Invoice</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Suite / spec</td><td style="padding:6px 0;"><strong>${{ steps.report.outputs.label }}</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Workflow run</td><td style="padding:6px 0;"><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open in GitHub Actions</a></td></tr>
            </table>
            <h3 style="margin:20px 0 8px 0;font-family:Segoe UI,Arial,sans-serif;">Test results</h3>
            <table style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:14px;border:1px solid #e5e7eb;">
              <tr style="background:#f3f4f6;"><th style="padding:8px 16px;text-align:left;border:1px solid #e5e7eb;">Metric</th><th style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;">Count</th></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Passed</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;color:#15803d;"><strong>${{ steps.summary.outputs.passed }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Failed</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;color:#b91c1c;"><strong>${{ steps.summary.outputs.failed }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Skipped</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.skipped }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Flaky</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.flaky }}</strong></td></tr>
              <tr style="background:#fafafa;"><td style="padding:8px 16px;border:1px solid #e5e7eb;"><strong>Total</strong></td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.total }}</strong></td></tr>
            </table>
            <p style="margin-top:16px;font-family:Segoe UI,Arial,sans-serif;font-size:14px;">Overall: <strong>${{ steps.summary.outputs.overall }}</strong></p>
            <p style="margin-top:24px;color:#64748b;font-size:13px;font-family:Segoe UI,Arial,sans-serif;">— Oman E-Invoice Automation · GitHub Actions</p>

  # Dispatch the next shard in this same workflow (one path — do not also chain from a test step).
  # if: always() covers pass/fail/cancel/timeout; a same-workflow job is less reliable on
  # full-run cancel than the old workflow_run trigger. Concurrency queues the dispatched run
  # until this run fully ends.
  queue-next:
    needs: [should_run, resolve, test]
    if: always() && needs.should_run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Queue next shard after this run finishes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}
          INPUT_SHARD: ${{ github.event.inputs.shard }}
          INPUT_CHAIN: ${{ github.event.inputs.chain }}
        shell: bash
        run: |
          set -euo pipefail

          SUITE=""
          SHARD=""

          if [ "$EVENT_NAME" = "schedule" ]; then
            SUITE="covoro_field"
            SHARD="1"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${INPUT_CHAIN:-false}" != "true" ]; then
              echo "Manual run without chain — not chaining."
              exit 0
            fi
            if [ "${INPUT_SHARD}" = "all" ]; then
              echo "All-shards run — not chaining."
              exit 0
            fi
            SUITE="$INPUT_SUITE"
            SHARD="$INPUT_SHARD"
          else
            echo "Unexpected event $EVENT_NAME — not chaining."
            exit 0
          fi

          NEXT_SUITE=""
          NEXT_SHARD=""
          case "$SUITE-$SHARD" in
            covoro_field-1) NEXT_SUITE="covoro_field"; NEXT_SHARD="2" ;;
            covoro_field-2) NEXT_SUITE="covoro_field"; NEXT_SHARD="3" ;;
            covoro_field-3) NEXT_SUITE="covoro_field"; NEXT_SHARD="4" ;;
            covoro_field-4) NEXT_SUITE="covoro_field"; NEXT_SHARD="5" ;;
            covoro_field-5) NEXT_SUITE="covoro_conditional"; NEXT_SHARD="1" ;;
            covoro_conditional-1) NEXT_SUITE="covoro_conditional"; NEXT_SHARD="2" ;;
            covoro_conditional-2) NEXT_SUITE="covoro_conditional"; NEXT_SHARD="3" ;;
            covoro_conditional-3) NEXT_SUITE="covoro_formula"; NEXT_SHARD="1" ;;
            covoro_formula-1) NEXT_SUITE="covoro_formula"; NEXT_SHARD="2" ;;
            covoro_formula-2) NEXT_SUITE="covoro_formula"; NEXT_SHARD="3" ;;
            covoro_formula-3) NEXT_SUITE="covoro_formula"; NEXT_SHARD="4" ;;
            covoro_formula-4) NEXT_SUITE="covoro_formula"; NEXT_SHARD="5" ;;
            covoro_formula-5)
              echo "Formula shard 5 finished — morning/evening wave complete."
              exit 0
              ;;
            *)
              echo "::warning::No next shard for $SUITE shard $SHARD — stopping."
              exit 0
              ;;
          esac

          echo "Queueing next: $NEXT_SUITE shard $NEXT_SHARD"
          gh workflow run playwright.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f suite="$NEXT_SUITE" \
            -f shard="$NEXT_SHARD" \
            -f chain=true
