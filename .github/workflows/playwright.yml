# Cron 05:45 IST Mon–Fri: Copy → Conditional Copy → Simplified field → Simplified conditional → Edit → Create → Covoro submit multi-item.
# Covoro submit single is manual only (not queued). Run workflow offers submit 1 … submit 5 (at most 400 tests each).
# Create Invoice UI submit single is the same split: ui submit 1 … ui submit 6 (at most 400 tests each). Zero rated rows are not in that spec.
# Formula stays on manual family chains.
# Manual Run: Create → Conditional Create; Edit → Conditional Edit; Covoro field → formula → conditional
# (same for Simplified Excel). Copy without scheduled_wave stops after Conditional Copy.
# Email digest (pass / fail / skip / flaky) → repo Variable EMAIL_RECIPIENTS_BASE (comma-separated).
name: Oman E-Invoice — Playwright

on:
  schedule:
    # 05:45 Asia/Kolkata Mon–Fri = 00:15 UTC (weekday is the same IST/UTC at this hour)
    - cron: "15 0 * * 1-5"
  workflow_dispatch:
    inputs:
      suite:
        description: "Automation suite to run. Covoro submit single: pick submit 1, submit 2, … (400 tests each). UI submit single: pick ui submit 1, ui submit 2, … (400 tests each; Zero rated is not run)."
        required: true
        default: "covoro_ui_copy"
        type: choice
        options:
          - covoro_ui_copy
          - covoro_ui_conditional_copy
          - covoro_ui_edit
          - simplified_field
          - simplified_formula
          - simplified_conditional
          - covoro_field
          - covoro_formula
          - covoro_conditional
          - submit 1
          - submit 2
          - submit 3
          - submit 4
          - submit 5
          - ui submit 1
          - ui submit 2
          - ui submit 3
          - ui submit 4
          - ui submit 5
          - ui submit 6
          - covoro_submit_multi
          - covoro_ui_create
          - covoro_ui_conditional_create
          - covoro_ui_conditional_edit
      scheduled_wave:
        description: "On Copy: morning queue after Conditional Copy — Simplified field, Simplified conditional, Edit, Create, Covoro submit multi-item. Leave off for Copy pair only. Without this, Create/Edit/Covoro/Simplified stay on their own family. Edit with this on continues from Edit (Create, then Covoro submit multi-item). Submit 1–5 and UI submit 1–6 are separate manual runs."
        type: boolean
        required: false
        default: false

run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled Copy, Simplified, Edit, Create, Covoro submit multi'
      || github.event.inputs.suite == 'simplified_field' && 'Simplified field validation'
      || github.event.inputs.suite == 'simplified_formula' && 'Simplified formula validation'
      || github.event.inputs.suite == 'simplified_conditional' && 'Simplified conditional validation'
      || github.event.inputs.suite == 'covoro_field' && 'Covoro field validation'
      || github.event.inputs.suite == 'covoro_formula' && 'Covoro formula validation'
      || github.event.inputs.suite == 'covoro_conditional' && 'Covoro conditional validation'
      || startsWith(github.event.inputs.suite, 'submit ') && format('Covoro {0}', github.event.inputs.suite)
      || startsWith(github.event.inputs.suite, 'ui submit ') && format('UI {0}', github.event.inputs.suite)
      || github.event.inputs.suite == 'covoro_submit_multi' && 'Covoro submit multi-item'
      || startsWith(github.event.inputs.suite, 'covoro_ui_') && github.event.inputs.suite
      || 'Copy Invoice UI' }}

concurrency:
  group: omn-e-invoice-playwright
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  SUBMIT_INVOICE_COMBINATIONS: "all"
  PW_WORKERS: "5"
  PW_CI_FULL_SUITE_TIMEOUT_MINUTES: "240"

jobs:
  should_run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - name: Gate scheduled wave (pause file)
        id: gate
        shell: bash
        run: |
          WAVE=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WAVE=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.scheduled_wave }}" = "true" ]; then
            WAVE=true
          fi
          if [ "$WAVE" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE=".github/PLAYWRIGHT_SKIP_SCHEDULE_UNTIL"
          TODAY_IST="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          if [ ! -f "$FILE" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          READ="$(tr -d '\r\n' < "$FILE" | head -c 64)"
          if [ "$READ" = "manual" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled Playwright runs are paused until Start. Resume: Actions → Oman E-Invoice — Schedule control → start."
            exit 0
          fi
          if [ "$READ" = "$TODAY_IST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled Playwright runs are paused for IST date ${TODAY_IST} (legacy 1-day pause). Resume early: Actions → Oman E-Invoice — Schedule control → start."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  resolve:
    needs: should_run
    if: needs.should_run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      spec: ${{ steps.plan.outputs.spec }}
      project: ${{ steps.plan.outputs.project }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      shard_indices: ${{ steps.plan.outputs.shard_indices }}
      shard_size: ${{ steps.plan.outputs.shard_size }}
      job_timeout_minutes: ${{ steps.plan.outputs.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve suite (manual dropdown)
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.suite }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$MODE" ]; then
            MODE="covoro_ui_copy"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            "submit "[1-9]*|covoro_submit_single)
              echo "count_submit=true" >> "$GITHUB_OUTPUT"
              echo "count_spec=tests/OMN_SubmitInvoice_CovoroTemplate_Test.spec.ts" >> "$GITHUB_OUTPUT"
              echo "count_project=chromium" >> "$GITHUB_OUTPUT"
              ;;
            "ui submit "[1-9]*|covoro_ui_submit)
              echo "count_submit=true" >> "$GITHUB_OUTPUT"
              echo "count_spec=tests/OMAN_UI_SPEC/OMN_UISubmitInvoice_Test.spec.ts" >> "$GITHUB_OUTPUT"
              echo "count_project=chromium-ui" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "count_submit=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Running MODE=$MODE"

      - uses: actions/setup-node@v5
        if: steps.mode.outputs.count_submit == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies (submit test count)
        if: steps.mode.outputs.count_submit == 'true'
        timeout-minutes: 10
        run: npm ci --no-fund --no-audit

      - name: Count submit single tests
        id: submit_count
        if: steps.mode.outputs.count_submit == 'true'
        env:
          BASE_URL: https://example.invalid
          OMN_EINVOICE_SELLER_TIN_SLOTS: ${{ secrets.OMN_EINVOICE_SELLER_TIN_SLOTS || secrets.UAE_EINVOICE_SELLER_TIN_SLOTS }}
          OMN_EINVOICE_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_COUNTERPARTY_ELECTRONIC || secrets.UAE_EINVOICE_COUNTERPARTY_ELECTRONIC }}
          OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC || secrets.UAE_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC }}
          OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC || 'OM1708202605' }}
        run: |
          set -euo pipefail
          SPEC="${{ steps.mode.outputs.count_spec }}"
          PROJECT="${{ steps.mode.outputs.count_project }}"
          OUT="$(npx playwright test "$SPEC" --project="$PROJECT" --list)"
          printf '%s\n' "$OUT"
          COUNT="$(printf '%s\n' "$OUT" | sed -n -E 's/^Total: ([0-9]+) tests?.*/\1/p' | tail -n 1)"
          if [ -z "${COUNT:-}" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Could not count submit single tests in ${SPEC}"
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Submit single test count (${PROJECT} ${SPEC}): $COUNT"

      - name: Plan Playwright suite
        id: plan
        env:
          TEST_COUNT: ${{ steps.submit_count.outputs.count }}
        shell: bash
        run: |
          bash scripts/ci_playwright_shard_plan.sh \
            "${{ steps.mode.outputs.mode }}"

  test:
    needs: resolve
    name: ${{ startsWith(needs.resolve.outputs.mode, 'ui submit ') && format('ui submit {0}', matrix.shard) || startsWith(needs.resolve.outputs.mode, 'submit ') && format('submit {0}', matrix.shard) || (needs.resolve.outputs.shard_total == '1' && format('test ({0})', needs.resolve.outputs.mode) || format('test ({0} {1}/{2})', needs.resolve.outputs.mode, matrix.shard, needs.resolve.outputs.shard_total)) }}
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.job_timeout_minutes) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJson(needs.resolve.outputs.shard_indices) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        timeout-minutes: 10
        run: npm ci --no-fund --no-audit

      - name: Verify pinned Node and Playwright
        run: |
          node -v
          npx playwright --version
          node -e "const v=require('@playwright/test/package.json').version; if(v!=='1.60.0'){console.error('Expected @playwright/test 1.60.0, got '+v); process.exit(1)}"

      - name: Set up Java (Allure report generator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ hashFiles('package-lock.json') }}

      # ubuntu-24.04 GitHub runners: azure.archive.ubuntu.com hangs, and HTTP
      # archive/security.ubuntu.com often fails on :80 (Connection failed).
      # Prefer HTTPS (:443). If apt still cannot reach Ubuntu, skip --with-deps —
      # the runner image already ships Chrome/Chromium system libraries.
      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' -o -name 'sources.list' \) \
            -exec sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              {} +
          printf '%s\n' \
            'https://archive.ubuntu.com/ubuntu/' \
            'https://security.ubuntu.com/ubuntu/' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-apt-timeout >/dev/null
          if npx playwright install chromium --with-deps; then
            exit 0
          fi
          echo "::warning::playwright install --with-deps failed (Ubuntu apt mirrors). Installing Chromium without system packages."
          npx playwright install chromium

      - name: Create .env file
        env:
          OMN_EINVOICE_SELLER_TIN_SLOTS: ${{ secrets.OMN_EINVOICE_SELLER_TIN_SLOTS || secrets.UAE_EINVOICE_SELLER_TIN_SLOTS }}
          OMN_EINVOICE_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_COUNTERPARTY_ELECTRONIC || secrets.UAE_EINVOICE_COUNTERPARTY_ELECTRONIC }}
          OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC || secrets.UAE_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC }}
          OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC: ${{ secrets.OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC || 'OM1708202605' }}
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "OMN_EINVOICE_SELLER_TIN_SLOTS=${OMN_EINVOICE_SELLER_TIN_SLOTS}" >> .env
          echo "OMN_EINVOICE_COUNTERPARTY_ELECTRONIC=${OMN_EINVOICE_COUNTERPARTY_ELECTRONIC}" >> .env
          echo "OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC=${OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC}" >> .env
          echo "OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC=${OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC}" >> .env

      - name: Verify required environment variables
        run: |
          missing=0
          for key in BASE_URL TEST_USER_EMAIL TEST_USER_PASSWORD OMN_EINVOICE_SELLER_TIN_SLOTS OMN_EINVOICE_COUNTERPARTY_ELECTRONIC OMN_EINVOICE_SIMPLIFIED_COUNTERPARTY_ELECTRONIC OMN_EINVOICE_SIMPLIFIED_IMPORT_GOODS_COUNTERPARTY_ELECTRONIC; do
            val=$(grep -E "^${key}=" .env | cut -d= -f2- || true)
            if [ -z "${val:-}" ]; then
              echo "::error::Missing or empty ${key}. Set the ${key} secret in GitHub Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Run Playwright — Simplified / Covoro manual / UI
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results-full.json
          PW_WORKERS: "5"
        run: |
          SPEC="${{ needs.resolve.outputs.spec }}"
          PROJECT="${{ needs.resolve.outputs.project }}"
          SHARD="${{ matrix.shard }}"
          TOTAL="${{ needs.resolve.outputs.shard_total }}"
          set -e
          echo "Running shard ${SHARD}/${TOTAL} on ${SPEC} --project=${PROJECT}"
          npx playwright test "$SPEC" --project="$PROJECT" --shard="${SHARD}/${TOTAL}"

      - name: Report name (matches run name)
        id: report
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.resolve.outputs.shard_total }}
        run: |
          MODE="${{ needs.resolve.outputs.mode }}"
          case "$MODE" in
            simplified_field) LABEL="Simplified field validation" ;;
            simplified_formula) LABEL="Simplified formula validation" ;;
            simplified_submit_single) LABEL="Simplified submit single" ;;
            simplified_submit_multi) LABEL="Simplified submit multi-item" ;;
            simplified_conditional) LABEL="Simplified conditional validation" ;;
            covoro_field) LABEL="Covoro field validation" ;;
            covoro_formula) LABEL="Covoro formula validation" ;;
            covoro_conditional) LABEL="Covoro conditional validation" ;;
            covoro_submit_single|submit\ [1-9]*)
              LABEL="Covoro submit ${SHARD}"
              ;;
            covoro_ui_submit|ui\ submit\ [1-9]*)
              LABEL="UI submit ${SHARD}"
              ;;
            covoro_submit_multi) LABEL="Covoro submit multi-item" ;;
            covoro_ui_copy) LABEL="UI copy" ;;
            covoro_ui_conditional_copy) LABEL="UI conditional copy" ;;
            covoro_ui_create) LABEL="UI create" ;;
            covoro_ui_conditional_create) LABEL="UI conditional create" ;;
            covoro_ui_edit) LABEL="UI edit" ;;
            covoro_ui_conditional_edit) LABEL="UI conditional edit" ;;
            *) LABEL="Playwright ${MODE}" ;;
          esac
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Report name: $LABEL"

      - name: Generate Allure report (single-file HTML)
        if: always()
        shell: bash
        run: |
          LABEL="${{ steps.report.outputs.label }}"
          if [ -d allure-results ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate allure-results --clean --single-file -o allure-report
            cp -f allure-report/index.html "${LABEL}.html"
          else
            echo "No allure-results; skipping Allure HTML"
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.report.outputs.label }}
          path: ${{ steps.report.outputs.label }}.html
          retention-days: 2
          if-no-files-found: ignore

      - name: Summarize Playwright results (pass / fail / skip / flaky)
        id: summary
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results-full.json
        run: python scripts/playwright_json_summary.py

      - name: Prepare email (Allure attachment)
        id: email_attach
        if: always()
        env:
          EMAIL_MAX_ATTACHMENT_BYTES: ${{ vars.EMAIL_MAX_ATTACHMENT_BYTES }}
        shell: bash
        run: |
          MAX="${EMAIL_MAX_ATTACHMENT_BYTES:-23068672}"
          LABEL="${{ steps.report.outputs.label }}"
          HTML="${LABEL}.html"
          ZIP="${LABEL}.zip"
          GZ="${LABEL}.html.gz"
          LIST=""
          rm -f allure-report-email.zip allure-index.html.gz "$ZIP" "$GZ"

          if [ -f "$HTML" ] || [ -f allure-report/index.html ]; then
            SRC="$HTML"
            if [ ! -f "$SRC" ]; then
              SRC="allure-report/index.html"
            fi
            SZ=$(wc -c < "$SRC" | tr -d ' ')
            if [ "${SZ:-0}" -le "$MAX" ] && [ "${SZ:-0}" -gt 32 ]; then
              if [ "$SRC" != "$HTML" ]; then
                cp -f "$SRC" "$HTML"
              fi
              LIST="$HTML"
            else
              zip -9 -q "$ZIP" "$SRC"
              if [ -f "$ZIP" ]; then
                ZSZ=$(wc -c < "$ZIP" | tr -d ' ')
                if [ "${ZSZ:-0}" -le "$MAX" ] && [ "${ZSZ:-0}" -gt 32 ]; then
                  LIST="$ZIP"
                else
                  rm -f "$ZIP"
                  gzip -9 -c "$SRC" > "$GZ"
                  GSZ=$(wc -c < "$GZ" | tr -d ' ')
                  if [ "${GSZ:-0}" -le "$MAX" ] && [ "${GSZ:-0}" -gt 32 ]; then
                    LIST="$GZ"
                  else
                    rm -f "$GZ"
                  fi
                fi
              fi
            fi
          fi

          echo "files=$LIST" >> "$GITHUB_OUTPUT"

      - name: Prepare SMTP email
        id: mail
        if: always()
        shell: bash
        run: |
          if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email skipped — set SMTP_HOST, SMTP_USER, and SMTP_PASS in repo Actions secrets."
            exit 0
          fi

          R="${EMAIL_RECIPIENTS_BASE:-${EMAIL_TO:-}}"
          if [ -z "${R:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email skipped — set repo Variable EMAIL_RECIPIENTS_BASE or secret EMAIL_TO."
            exit 0
          fi

          FROM_ADDR="${EMAIL_FROM:-$SMTP_USER}"
          PORT="${SMTP_PORT:-587}"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "to=$R" >> "$GITHUB_OUTPUT"
          echo "from=$FROM_ADDR" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          if [ "$PORT" = "465" ]; then
            echo "secure=true" >> "$GITHUB_OUTPUT"
          else
            echo "secure=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_RECIPIENTS_BASE: ${{ vars.EMAIL_RECIPIENTS_BASE }}

      - name: Email digest metadata (UTC date)
        id: mail_body
        if: always()
        shell: bash
        run: |
          {
            echo "date<<MAILBODY_EOF"
            date -u +'%d %b %Y'
            echo "MAILBODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email — execution digest
        if: ${{ !cancelled() && steps.mail.outputs.ok == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ steps.mail.outputs.port }}
          secure: ${{ steps.mail.outputs.secure == 'true' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: >-
            Oman E-Invoice (${{ steps.report.outputs.label }}) — PASSED ${{ steps.summary.outputs.passed }}, FAILED ${{ steps.summary.outputs.failed }}, SKIPPED ${{ steps.summary.outputs.skipped }}, FLAKY ${{ steps.summary.outputs.flaky }}
          to: ${{ steps.mail.outputs.to }}
          from: ${{ steps.mail.outputs.from }}
          attachments: ${{ steps.email_attach.outputs.files }}
          body: |
            Hi Team — Oman E-Invoice Playwright summary (${{ steps.mail_body.outputs.date }} UTC).
            Passed ${{ steps.summary.outputs.passed }}, Failed ${{ steps.summary.outputs.failed }}, Skipped ${{ steps.summary.outputs.skipped }}, Flaky ${{ steps.summary.outputs.flaky }} (total ${{ steps.summary.outputs.total }}).
            Overall: ${{ steps.summary.outputs.overall }}.
            Suite: ${{ steps.report.outputs.label }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: |
            <p>Hi Team,</p>
            <p>Please find below the <strong>automation test execution summary</strong> for the <strong>Oman E-Invoice</strong> framework (Playwright).</p>
            <h3 style="margin:20px 0 8px 0;font-family:Segoe UI,Arial,sans-serif;">Execution summary</h3>
            <table style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:14px;max-width:560px;">
              <tr><td style="padding:6px 16px 6px 0;color:#555;vertical-align:top;">Date (UTC)</td><td style="padding:6px 0;"><strong>${{ steps.mail_body.outputs.date }}</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Framework</td><td style="padding:6px 0;"><strong>Oman E-Invoice</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Suite / spec</td><td style="padding:6px 0;"><strong>${{ steps.report.outputs.label }}</strong></td></tr>
              <tr><td style="padding:6px 16px 6px 0;color:#555;">Workflow run</td><td style="padding:6px 0;"><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open in GitHub Actions</a></td></tr>
            </table>
            <h3 style="margin:20px 0 8px 0;font-family:Segoe UI,Arial,sans-serif;">Test results</h3>
            <table style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:14px;border:1px solid #e5e7eb;">
              <tr style="background:#f3f4f6;"><th style="padding:8px 16px;text-align:left;border:1px solid #e5e7eb;">Metric</th><th style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;">Count</th></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Passed</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;color:#15803d;"><strong>${{ steps.summary.outputs.passed }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Failed</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;color:#b91c1c;"><strong>${{ steps.summary.outputs.failed }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Skipped</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.skipped }}</strong></td></tr>
              <tr><td style="padding:8px 16px;border:1px solid #e5e7eb;">Flaky</td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.flaky }}</strong></td></tr>
              <tr style="background:#fafafa;"><td style="padding:8px 16px;border:1px solid #e5e7eb;"><strong>Total</strong></td><td style="padding:8px 16px;text-align:right;border:1px solid #e5e7eb;"><strong>${{ steps.summary.outputs.total }}</strong></td></tr>
            </table>
            <p style="margin-top:16px;font-family:Segoe UI,Arial,sans-serif;font-size:14px;">Overall: <strong>${{ steps.summary.outputs.overall }}</strong></p>
            <p style="margin-top:24px;color:#64748b;font-size:13px;font-family:Segoe UI,Arial,sans-serif;">— Oman E-Invoice Automation · GitHub Actions</p>

  queue-next:
    needs: [should_run, resolve, test]
    if: |
      always()
      && needs.should_run.outputs.skip != 'true'
      && needs.resolve.result == 'success'
      && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch next suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ needs.resolve.outputs.mode }}
          SHARD_TOTAL: ${{ needs.resolve.outputs.shard_total }}
          REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WAVE: ${{ github.event.inputs.scheduled_wave }}
        shell: bash
        run: |
          set -euo pipefail
          WAVE=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_WAVE" = "true" ]; then
            WAVE=true
          fi
          MAP="$(bash scripts/ci_queue_next.sh "$CURRENT" "$WAVE" "${SHARD_TOTAL:-}")"
          NEXT="$(printf '%s\n' "$MAP" | awk -F= '/^next=/{print substr($0,6)}')"
          DISPATCH_WAVE="$(printf '%s\n' "$MAP" | awk -F= '/^dispatch_wave=/{print substr($0,15)}')"
          if [ -z "$NEXT" ]; then
            echo "Queue complete after ${CURRENT} (wave=${WAVE})."
            exit 0
          fi
          echo "queue-next: ${CURRENT} → ${NEXT} dispatch_wave=${DISPATCH_WAVE} (ref ${REF})"
          gh workflow run playwright.yml --repo "$GH_REPO" --ref "$REF" \
            -f suite="$NEXT" \
            -f scheduled_wave="$DISPATCH_WAVE"

